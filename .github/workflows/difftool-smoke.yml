name: difftool cross-platform smoke

# GB-856 — verify the `git difftool` desktop launch on Linux and discover the
# Windows bundle layout. Manual / branch-scoped; not part of the release flow.
on:
  workflow_dispatch:
  push:
    branches:
      - 'gb-856-**'

jobs:
  linux-verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Build sidecar
        run: bash scripts/build-sidecar.sh x86_64-unknown-linux-gnu
      - name: Build .deb (updater-signing failure after bundling is fine)
        run: npm run tauri build -- --bundles deb || true
      - name: Install the .deb
        run: |
          DEB=$(find src-tauri/target -name "*.deb" | head -1)
          echo "Installing $DEB"
          # `./`-prefix the path so apt treats it as a local file, not a pkg name.
          sudo apt-get install -y "./$DEB"
      - name: Verify installed shim paths + bundled server (no GUI)
        run: |
          set -euo pipefail
          test -x /usr/bin/glassbox && echo "ok glassbox bin"
          test -x /usr/bin/glassbox-node && echo "ok glassbox-node bin"
          test -f /usr/lib/Glassbox/server/cli.js && echo "ok cli.js"
          test -f /usr/lib/Glassbox/server/cli-difftool.js && echo "ok cli-difftool.js"
          test -f /usr/lib/Glassbox/resources/glassbox-difftool-linux && echo "ok difftool shim"
          # Bundled node serves a --diff review from the installed layout.
          mkdir -p /tmp/L /tmp/R
          printf 'a\nb\nc\n' > /tmp/L/f.txt
          printf 'a\nX\nc\n' > /tmp/R/f.txt
          /usr/bin/glassbox-node /usr/lib/Glassbox/server/cli.js --diff /tmp/L /tmp/R --no-open --port 4321 --strict-port > /tmp/srv.log 2>&1 &
          for i in $(seq 1 80); do grep -q "running at" /tmp/srv.log && break; sleep 0.25; done
          cat /tmp/srv.log
          RID=$(grep -oE "Review [a-z0-9]+ created" /tmp/srv.log | awk '{print $2}' | head -1)
          curl -s "http://localhost:4321/api/files?reviewId=$RID" | grep -q "f.txt" && echo "ok diff review contains f.txt"
      - name: Best-effort full GUI launch under xvfb (non-fatal)
        continue-on-error: true
        run: |
          set -x
          # Register the difftool against the installed wrapper, then drive it.
          # The launch blocks (waits for the window), so background + timeout.
          mkdir -p ~/.local/bin
          ln -sf /usr/lib/Glassbox/resources/glassbox-difftool-linux ~/.local/bin/glassbox-difftool
          export PATH="$HOME/.local/bin:$PATH"
          R=$(mktemp -d); cd "$R"; git init -q; git config user.email t@t; git config user.name t
          printf 'a\nb\n' > x.txt; git add -A; git commit -qm one
          printf 'a\nB\n' > x.txt; git add -A; git commit -qm two
          git config diff.tool glassbox
          git config difftool.glassbox.cmd 'glassbox-difftool "$LOCAL" "$REMOTE"'
          git config difftool.prompt false
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          timeout 45 xvfb-run -a git difftool --dir-diff HEAD^ HEAD &
          GUI=$!
          ok=0
          for i in $(seq 1 60); do
            if pgrep -f "cli.js.*--diff" >/dev/null; then ok=1; break; fi
            sleep 0.5
          done
          if [ "$ok" = 1 ]; then echo "GUI smoke: sidecar with --diff spawned"; else echo "GUI smoke: sidecar not observed (webkit headless may have failed)"; fi
          kill $GUI 2>/dev/null || true
          pkill -f glassbox-node 2>/dev/null || true

  windows-verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - name: Build sidecar
        run: bash scripts/build-sidecar.sh x86_64-pc-windows-msvc
        shell: bash
      - name: Build app (updater-signing failure after bundling is fine)
        run: npm run tauri build -- --bundles nsis
        continue-on-error: true
      - name: Verify shim paths + bundled server (no GUI)
        shell: pwsh
        run: |
          $rel = "src-tauri/target/release"
          $fail = $false
          function Check($path, $label) {
            if (Test-Path $path) { Write-Host "  ok   $label -> $path" }
            else { Write-Host "  FAIL $label -> $path (missing)"; $script:fail = $true }
          }
          Write-Host ">>> shim path resolution (build layout = installed layout, relatively)"
          # glassbox-difftool.cmd lives in resources\; binaries are one level up,
          # cli-difftool.js is in ..\server\.
          Check "$rel/glassbox.exe"               "TAURI_BIN (..\glassbox.exe)"
          Check "$rel/glassbox-node.exe"          "NODE_BIN  (..\glassbox-node.exe)"
          Check "$rel/server/cli.js"              "CLI_JS    (..\server\cli.js)"
          Check "$rel/server/cli-difftool.js"     "CLI_DIFFTOOL_JS (..\server\cli-difftool.js)"
          Check "$rel/resources/glassbox.cmd"     "launcher shim"
          Check "$rel/resources/glassbox-difftool.cmd" "difftool shim"

          Write-Host ">>> bundled Node serves a --diff review"
          New-Item -ItemType Directory -Force -Path L,R | Out-Null
          Set-Content -Path L/f.txt -Encoding ascii -Value @('alpha','beta','gamma')
          Set-Content -Path R/f.txt -Encoding ascii -Value @('alpha','BETA-CHANGED','gamma','delta')
          Write-Host "--- L/f.txt ---"; Get-Content L/f.txt
          Write-Host "--- R/f.txt ---"; Get-Content R/f.txt
          Write-Host "--- raw git diff --no-index (exit code follows) ---"
          git --no-pager diff --no-index L/f.txt R/f.txt
          Write-Host "git diff --no-index exit = $LASTEXITCODE"
          $p = Start-Process -PassThru -NoNewWindow -FilePath "$rel/glassbox-node.exe" `
            -ArgumentList "$rel/server/cli.js","--diff","L","R","--no-open","--port","4321","--strict-port" `
            -RedirectStandardOutput srv.log -RedirectStandardError srverr.log
          $up = $false
          for ($i=0; $i -lt 80; $i++) {
            if ((Test-Path srv.log) -and (Select-String -Quiet "running at" srv.log)) { $up = $true; break }
            Start-Sleep -Milliseconds 250
          }
          Get-Content srv.log -ErrorAction SilentlyContinue
          if ($up) {
            $code = (Invoke-WebRequest -UseBasicParsing http://localhost:4321/).StatusCode
            if ($code -eq 200) { Write-Host "  ok   server responded 200" } else { Write-Host "  FAIL HTTP $code"; $fail = $true }
            $rid = (Select-String -Path srv.log -Pattern "Review ([a-z0-9]+) created").Matches.Groups[1].Value
            $files = (Invoke-WebRequest -UseBasicParsing "http://localhost:4321/api/files?reviewId=$rid").Content
            if ($files -match "f.txt") { Write-Host "  ok   diff review contains f.txt" } else { Write-Host "  FAIL diff empty: $($files.Substring(0,[Math]::Min(120,$files.Length)))"; $fail = $true }
          } else {
            Write-Host "  FAIL server did not start"; Get-Content srverr.log -ErrorAction SilentlyContinue; $fail = $true
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if ($fail) { Write-Host "FAIL"; exit 1 } else { Write-Host "PASS: Windows difftool paths + server verified" }
      - name: Best-effort full GUI launch (non-fatal; Windows runners have a desktop)
        continue-on-error: true
        shell: pwsh
        run: |
          $rel = "src-tauri/target/release"
          # Drive the difftool wrapper directly (skip NSIS install): point a git
          # repo's difftool at glassbox-difftool.cmd via the build-layout paths.
          $repo = Join-Path $env:RUNNER_TEMP "difftool-repo"
          New-Item -ItemType Directory -Force -Path $repo | Out-Null
          Push-Location $repo
          git init -q; git config user.email t@t; git config user.name t
          "a`nb" | Out-File -Encoding ascii x.txt; git add -A; git commit -qm one
          "a`nB" | Out-File -Encoding ascii x.txt; git add -A; git commit -qm two
          $shim = (Resolve-Path "$env:GITHUB_WORKSPACE/$rel/resources/glassbox-difftool.cmd").Path
          git config diff.tool glassbox
          git config difftool.glassbox.cmd "`"$shim`" `$LOCAL `$REMOTE"
          git config difftool.prompt false
          $job = Start-Job { git difftool --dir-diff HEAD^ HEAD }
          $ok = $false
          for ($i=0; $i -lt 60; $i++) {
            if (Get-Process glassbox-node -ErrorAction SilentlyContinue) { $ok = $true; break }
            Start-Sleep -Milliseconds 500
          }
          if ($ok) { Write-Host "GUI smoke: glassbox-node sidecar spawned" } else { Write-Host "GUI smoke: sidecar not observed" }
          Stop-Job $job -ErrorAction SilentlyContinue; Remove-Job $job -Force -ErrorAction SilentlyContinue
          Get-Process glassbox,glassbox-node -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Pop-Location
