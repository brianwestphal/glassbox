name: Release Desktop App

permissions:
  contents: write

on:
  push:
    tags:
      - 'v[0-9]*'
      - '!v*-rc.*'
      - '!v*-beta.*'

  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.0)'
        required: true

jobs:
  # Create the GitHub Release first so build jobs don't race
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract release notes from tag
        id: tag_notes
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          NOTES=$(git tag -l --format='%(contents)' "$TAG" | sed '/^$/d')
          if [ -z "$NOTES" ]; then
            NOTES="See the assets below to download and install."
          fi
          echo "body<<ENDOFNOTES" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "ENDOFNOTES" >> "$GITHUB_OUTPUT"

      - name: Create release
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}';
            const isDraft = ${{ github.event_name == 'workflow_dispatch' && github.ref_name != 'main' }};
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Glassbox ${tag}`,
              body: `${{ steps.tag_notes.outputs.body }}`.replace(/`/g, ''),
              draft: isDraft,
              prerelease: false,
            });
            return data.id;

  build:
    needs: create-release

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            friendly: macOS-Apple-Silicon
          - platform: macos-latest
            target: x86_64-apple-darwin
            friendly: macOS-Intel
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            friendly: Linux-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            friendly: Windows-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Build sidecar
        run: bash scripts/build-sidecar.sh ${{ matrix.target }}
        shell: bash

      - name: Build Tauri app and upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.target }}

      - name: Rename user-facing download assets to friendly names
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          FRIENDLY: ${{ matrix.friendly }}
        with:
          script: |
            const releaseId = parseInt(process.env.RELEASE_ID);
            const friendly = process.env.FRIENDLY;
            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
            });

            // Only rename DMGs — other artifacts keep original names
            // (updater assets are referenced by URL in latest.json)
            const renames = {
              '_aarch64.dmg': `_${friendly}.dmg`,
              '_x64.dmg': `_${friendly}.dmg`,
            };

            for (const asset of assets) {
              for (const [suffix, newSuffix] of Object.entries(renames)) {
                if (asset.name.endsWith(suffix)) {
                  const newName = asset.name.replace(suffix, newSuffix);
                  if (newName !== asset.name) {
                    console.log(`Renaming: ${asset.name} -> ${newName}`);
                    await github.rest.repos.updateReleaseAsset({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      asset_id: asset.id,
                      name: newName,
                    });
                  }
                  break;
                }
              }
            }
